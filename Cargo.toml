[package]
name = "blohard-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Content-addressed host for message bodies and attachments: stores what the chain anchors, serves it by hash, and indexes chain history."

[dependencies]
blohard-policy = { path = "policy" }
commonware-codec = { workspace = true }
commonware-runtime = { workspace = true }
commonware-storage = { workspace = true }
commonware-utils = { workspace = true }

alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
ens-normalize-rs = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
httpdate = "1"
k256 = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true, features = ["gzip", "brotli", "deflate"] }
html5ever = "0.39"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[workspace]
members = [".", "policy"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Pinned to the commit this code was written against, from Commonware's pull
# request 4644, which has since been merged. Moving to a release needs a check
# that existing stores still open.
commonware-codec = { git = "https://github.com/commonwarexyz/monorepo", rev = "7be24c73fc39d117bfa51f1df0ccd0e6b5b87f42" }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", rev = "7be24c73fc39d117bfa51f1df0ccd0e6b5b87f42" }
commonware-storage = { git = "https://github.com/commonwarexyz/monorepo", rev = "7be24c73fc39d117bfa51f1df0ccd0e6b5b87f42" }
commonware-utils = { git = "https://github.com/commonwarexyz/monorepo", rev = "7be24c73fc39d117bfa51f1df0ccd0e6b5b87f42" }

alloy-sol-types = "1.7"
alloy-primitives = "1.7"
anyhow = "1"
axum = "0.8"
bytes = "1.12"
clap = { version = "4", features = ["derive"] }
# ENS name normalization (ENSIP-15), for the display names the host verifies.
ens-normalize-rs = "0.2"
hex = "0.4"
rand_core = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "timeout", "trace"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
